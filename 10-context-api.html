<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React JS - Fundamentals</title>
</head>

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const CounterContext = React.createContext();

    function CounterProvider({ children }) {
      const [savedCounts, setSavedCounts] = React.useState([]);

      function saveCount(count) {
        setSavedCounts((prev) => [...prev, count]);
      }

      return (
        <CounterContext.Provider
          value={{ savedCounts, saveCount }}>
          {children}
        </CounterContext.Provider>
      )
    }

    function Counter() {
      const [counter, setCounter] = React.useState(0);
      const { saveCount } = React.useContext(CounterContext);

      if (counter == 20) {
        return (
          <div>
            <p>Chegou no limite de 20</p>
            <p>
              <button type="button" onClick={() => setCounter(0)}>
                Resetar
              </button>
            </p>
          </div>
        )
      }

      return (
        <div>
          <p>Contador: {counter}</p>
          <p>{counter > 10 ? 'Maior que 10' : 'Menor ou igual a 10'}</p>

          {counter > 15 && <p>ATENÇÃO - Counter maior que 15</p>}
          <p>
            <button type="button" onClick={() => setCounter(0)}>
              Resetar
            </button>
          </p>
          <p>
            <button type="button" onClick={() => setCounter((prevValue) => prevValue + 1)}>
              Incrementar
            </button>
          </p>
          <p>
            <button type="button" onClick={() => setCounter((prevValue) => prevValue - 1)}>
              Decrementar
            </button>
          </p>
          <p>
            <button onClick={() => saveCount(counter)}>Salvar</button>
          </p>
        </div >
      )
    }

    function CounterList() {
      const { savedCounts } = React.useContext(CounterContext);

      return (
        <div>
          <h2>Valores Salvos</h2>
          <ul>
            {savedCounts.map((value, index) =>
              <li key={`item-${index}`}>{value}</li>
            )}
          </ul>
        </div>
      );

    }

    function App() {
      return (
        <main>
          <CounterProvider>
            <Counter />
            <hr />
            <CounterList />
          </CounterProvider>
        </main>
      )
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
  </script>
</body>

</html>
