<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React JS - Fundamentals</title>
</head>

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">

    function InputFocus(){
      const inputRef = React.useRef(null);

      function handleFocus(){
        inputRef?.current?.focus();
      }

      return (
        <div className="m-8">
          <input ref={inputRef} type="text" placeholder="Focus me!" className="border-2 border-gray-300 rounded-md p-2" />
          <button className="ml-2 px-4 py-2 bg-blue-500 text-white rounded-md cursor-pointer" onClick={handleFocus}>Focus</button>
        </div>
      )
    }

    function App() {
      return (
        <main>
          <InputFocus />
        </main>
      )
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
  </script>
</body>

</html>
