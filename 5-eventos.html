<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React JS - Fundamentals</title>
</head>

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">

    function Alert1() {
      function handleAlertClick(event) {
        console.log(event);
        alert('Mensagem de alerta!');
      }

      return (
        <div>
          <button type="button" onClick={handleAlertClick}>
            Mostrar Alerta
          </button>
        </div>
      )
    }

    function Alert2() {
      function handleAlertClick(message) {
        alert(message);
      }

      return (
        <div>
          <button type="button" onClick={() => handleAlertClick('Mensagem de alerta  customizável')}>
            Mostrar Alerta Com Parametro
          </button>
        </div>
      )
    }

    function Alert3() {
      function handleAlertClick(event) {
        var inputValue = event.target.previousSibling.value;
        alert(inputValue);
      }

      function handleInputChange(event) {
        console.log(event.target.value);
      }

      return (
        <div>
          <input type="text" placeholder="Digite algo..." onChange={handleInputChange} />
          <button type="button" onClick={handleAlertClick}>
            Mostrar Alerta Do Campo
          </button>
        </div>
      )
    }

    function App() {
      return (
        <main>
          <Alert1 />
          <Alert2 />
          <Alert3 />
        </main>
      )
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
  </script>
</body>

</html>
